name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      IMMUTABLE_RELEASES_CONFIRMED: ${{ vars.IMMUTABLE_RELEASES_CONFIRMED }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate immutable release input
        run: |
          VERSION="$(script/validate_release_version.sh "$RELEASE_TAG")"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"
          test "$IMMUTABLE_RELEASES_CONFIRMED" = 'true' || {
            echo 'Repository immutable releases must be enabled and confirmed by the release maintainer.' >&2
            exit 1
          }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create or reuse the exact draft release
        run: |
          if gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease >/tmp/release.json 2>/dev/null; then
            ruby -rjson -e '
              release = JSON.parse(File.read(ARGV.fetch(0)))
              abort "release tag mismatch" unless release.fetch("tagName") == ENV.fetch("RELEASE_TAG")
              abort "published release is terminal and cannot be replaced" unless release.fetch("isDraft")
              abort "prerelease drafts are not accepted for the stable channel" if release.fetch("isPrerelease")
            ' /tmp/release.json
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "Canis97 $VERSION" \
              --generate-notes
          fi

      - name: Validate signing secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for required_name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!required_name}" || { echo "$required_name is not configured" >&2; exit 1; }
          done

      - name: Install Developer ID certificate in an ephemeral keychain
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/developer-id-cert.pem"
          PRIVATE_KEY_PEM="$RUNNER_TEMP/developer-id-key.pem"
          COMPATIBLE_P12="$RUNNER_TEMP/developer-id-keychain-compatible.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/canis97-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          COMPATIBLE_PASSWORD="$(openssl rand -hex 24)"
          export COMPATIBLE_PASSWORD
          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys \
            -passin env:MACOS_CERTIFICATE_PASSWORD \
            -out "$CERTIFICATE_PEM"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -nocerts \
            -passin env:MACOS_CERTIFICATE_PASSWORD \
            -passout env:COMPATIBLE_PASSWORD \
            -out "$PRIVATE_KEY_PEM"
          openssl pkcs12 -export \
            -in "$CERTIFICATE_PEM" \
            -inkey "$PRIVATE_KEY_PEM" \
            -passin env:COMPATIBLE_PASSWORD \
            -passout env:COMPATIBLE_PASSWORD \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1 \
            -out "$COMPATIBLE_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$GITHUB_WORKSPACE/Distribution/Certificates/DeveloperIDG2CA.cer" -t cert -k "$KEYCHAIN_PATH"
          security import "$COMPATIBLE_P12" -P "$COMPATIBLE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security \
            -f pkcs12 -k "$KEYCHAIN_PATH"
          unset COMPATIBLE_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application:/ { count++ } END { print count + 0 }')"
          test "$IDENTITY_COUNT" -eq 1 || { echo "Expected exactly one Developer ID Application identity; found $IDENTITY_COUNT" >&2; exit 1; }

      - name: Build, sign, notarize, and verify artifacts
        env:
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release
          RELEASE_WORK_DIR: ${{ runner.temp }}/release-work
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: script/create_release_artifacts.sh "$VERSION"

      - name: Upload final assets to the draft
        env:
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "$RELEASE_OUTPUT_DIR/Canis97-$VERSION-arm64.dmg" \
            "$RELEASE_OUTPUT_DIR/Canis97-$VERSION.spdx" \
            "$RELEASE_OUTPUT_DIR/Canis97-$VERSION.verification.json" \
            "$RELEASE_OUTPUT_DIR/SHA256SUMS"

      - name: Verify draft asset set before publication
        env:
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/release-download
        run: |
          mkdir -p "$RELEASE_DOWNLOAD_DIR"
          gh release download "$RELEASE_TAG" --dir "$RELEASE_DOWNLOAD_DIR" --clobber \
            --pattern "Canis97-$VERSION-arm64.dmg" \
            --pattern "Canis97-$VERSION.spdx" \
            --pattern "Canis97-$VERSION.verification.json" \
            --pattern SHA256SUMS
          for name in "Canis97-$VERSION-arm64.dmg" "Canis97-$VERSION.spdx" "Canis97-$VERSION.verification.json" SHA256SUMS; do
            test -f "$RELEASE_DOWNLOAD_DIR/$name"
            test "$(shasum -a 256 "$RELEASE_OUTPUT_DIR/$name" | awk '{print $1}')" = "$(shasum -a 256 "$RELEASE_DOWNLOAD_DIR/$name" | awk '{print $1}')"
          done
          (
            cd "$RELEASE_DOWNLOAD_DIR"
            shasum -a 256 -c SHA256SUMS
          )
          ruby -rjson -e '
            manifest = JSON.parse(File.read(ARGV.fetch(0)))
            archive = ARGV.fetch(1)
            digest = `shasum -a 256 #{archive}`.split.fetch(0)
            abort "manifest does not describe the final archive" unless manifest.fetch("final_archive") == File.basename(archive)
            abort "manifest final archive digest mismatch" unless manifest.fetch("final_archive_sha256") == digest
          ' "$RELEASE_DOWNLOAD_DIR/Canis97-$VERSION.verification.json" "$RELEASE_DOWNLOAD_DIR/Canis97-$VERSION-arm64.dmg"

      - name: Publish the verified immutable draft
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Inspect Homebrew tap configuration
        id: tap
        env:
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -n "$HOMEBREW_TAP_REPOSITORY" && -n "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Update the Homebrew tap
        if: ${{ steps.tap.outputs.enabled == 'true' }}
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release
        run: |
          TAP_PATH="$RUNNER_TEMP/homebrew-tap"
          ARCHIVE_SHA="$(awk '$2 ~ /Canis97-/ { print $1 }' "$RELEASE_OUTPUT_DIR/SHA256SUMS")"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          ssh-add - <<< "$HOMEBREW_TAP_DEPLOY_KEY"
          export GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=accept-new'
          git clone "git@github.com:$HOMEBREW_TAP_REPOSITORY.git" "$TAP_PATH"
          mkdir -p "$TAP_PATH/Casks"
          script/render_homebrew_cask.sh "$VERSION" "$ARCHIVE_SHA" "$GITHUB_REPOSITORY" > "$TAP_PATH/Casks/canis97.rb"
          git -C "$TAP_PATH" config user.name "github-actions[bot]"
          git -C "$TAP_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$TAP_PATH" add Casks/canis97.rb
          git -C "$TAP_PATH" commit -m "canis97 $VERSION"
          git -C "$TAP_PATH" push

      - name: Report skipped Homebrew publishing
        if: ${{ steps.tap.outputs.enabled != 'true' }}
        run: echo 'GitHub Release published; configure HOMEBREW_TAP_REPOSITORY and HOMEBREW_TAP_DEPLOY_KEY to publish the cask.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/canis97-release.keychain-db" 2>/dev/null || true
          rm -f -- \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/developer-id-cert.pem" \
            "$RUNNER_TEMP/developer-id-key.pem" \
            "$RUNNER_TEMP/developer-id-keychain-compatible.p12"
