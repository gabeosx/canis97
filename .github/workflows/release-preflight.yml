name: Release Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight
  cancel-in-progress: false

jobs:
  credentials:
    name: credentials
    runs-on: macos-26
    timeout-minutes: 15
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          for required_name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD; do
            test -n "${!required_name}" || { echo "$required_name is not configured" >&2; exit 1; }
          done

      - name: Validate Developer ID identity and notarization credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          CERTIFICATE_PEM="$RUNNER_TEMP/developer-id-cert.pem"
          PRIVATE_KEY_PEM="$RUNNER_TEMP/developer-id-key.pem"
          COMPATIBLE_P12="$RUNNER_TEMP/developer-id-keychain-compatible.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/canis97-preflight.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          COMPATIBLE_PASSWORD="$(openssl rand -hex 24)"
          export COMPATIBLE_PASSWORD
          umask 077
          printf '%s' "$MACOS_CERTIFICATE_P12" | /usr/bin/base64 -D > "$CERTIFICATE_PATH"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys \
            -passin env:MACOS_CERTIFICATE_PASSWORD \
            -out "$CERTIFICATE_PEM"
          openssl pkcs12 -in "$CERTIFICATE_PATH" -nocerts \
            -passin env:MACOS_CERTIFICATE_PASSWORD \
            -passout env:COMPATIBLE_PASSWORD \
            -out "$PRIVATE_KEY_PEM"
          openssl pkcs12 -export \
            -in "$CERTIFICATE_PEM" \
            -inkey "$PRIVATE_KEY_PEM" \
            -passin env:COMPATIBLE_PASSWORD \
            -passout env:COMPATIBLE_PASSWORD \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1 \
            -out "$COMPATIBLE_P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$GITHUB_WORKSPACE/Distribution/Certificates/DeveloperIDG2CA.cer" -t cert -k "$KEYCHAIN_PATH"
          security import "$COMPATIBLE_P12" -P "$COMPATIBLE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security \
            -f pkcs12 -k "$KEYCHAIN_PATH"
          unset COMPATIBLE_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY_COUNT="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application:/ { count++ } END { print count + 0 }')"
          test "$IDENTITY_COUNT" -eq 1 || { echo "Expected exactly one Developer ID Application identity; found $IDENTITY_COUNT" >&2; exit 1; }

          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            >/dev/null

      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/canis97-preflight.keychain-db" 2>/dev/null || true
          rm -f -- \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/developer-id-cert.pem" \
            "$RUNNER_TEMP/developer-id-key.pem" \
            "$RUNNER_TEMP/developer-id-keychain-compatible.p12"
